<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeOS</title>
  
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>


  <!-- HTMX CDN -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  
  <!-- Arcade/Chunky Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Centralized Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="os-container">
    <header class="os-header">
      <h1 class="os-title">Vibe OS</h1>
    </header>

<section class="os-workspace">
  <!-- 1. View Aesthetics -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-green"
      hx-get="aesthetics/index.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      View Aesthetics
    </button>
    <div class="drawer-output"></div>
  </div>

  <!-- 2. Spiritual Skills -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-cyan"
      hx-get="spiritual-skills.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      Spiritual Skills
    </button>
    <div class="drawer-output"></div>
  </div>

  <!-- 3. Genres -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-orange"
      hx-get="genres.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      Genres
    </button>
    <div class="drawer-output"></div>
  </div>

  <!-- 4. UX/DX Priority -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-purple"
      hx-get="uxpriority.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      UX/DX Priority
    </button>
    <div class="drawer-output"></div>
  </div>
</section>

<footer class="os-footer-nav">
  <div class="nav-row-bottom">
    <button 
      class="vibe-btn btn-doc"
      hx-get="design-process.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      📁 View Design Process Document
    </button>
    <div class="drawer-output"></div>
  </div>
</footer>

  </main>

    <!-- 2. Load Three.js Controllers from Root. This might need to be a separate file eventually -->
  <script type="module" src="js/aero-canvas.js"></script>
  <script type="module" src="js/vaporwave-canvas.js"></script>
<script>
document.body.addEventListener('htmx:beforeRequest', (evt) => {
  const triggerEl = evt.detail.elt;
  if (!triggerEl) return;

  // 1. Top-level OS navigation buttons (.vibe-btn)
  if (triggerEl.classList.contains('vibe-btn')) {
    const targetDrawer = triggerEl.nextElementSibling;
    document.querySelectorAll('.drawer-output').forEach((drawer) => {
      if (drawer !== targetDrawer) drawer.innerHTML = '';
    });
    if (targetDrawer && targetDrawer.innerHTML.trim() !== '') {
      evt.preventDefault();
      targetDrawer.innerHTML = '';
    }
  }

  // 2. Aesthetic family buttons (.family-card)
  if (triggerEl.classList.contains('family-card')) {
    const targetFamilyDrawer = triggerEl.nextElementSibling;
    document.querySelectorAll('.family-drawer').forEach((drawer) => {
      if (drawer !== targetFamilyDrawer) drawer.innerHTML = '';
    });
    if (targetFamilyDrawer && targetFamilyDrawer.innerHTML.trim() !== '') {
      evt.preventDefault();
      targetFamilyDrawer.innerHTML = '';
    }
  }
});

</script>


</body>
</html>
