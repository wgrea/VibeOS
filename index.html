<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeOS</title>
  
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>


  <!-- HTMX CDN -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  
  <!-- Arcade/Chunky Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Centralized Stylesheet -->
  <!-- Inside <head> of root index.html -->
    <!-- Keeps the style of the page -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="aesthetics/styles/index.css">
</head>
<body>

  <main class="os-container">
    <header class="os-header">
      <h1 class="os-title">Vibe OS</h1>
    </header>

<section class="os-workspace">
  <!-- 1. View Aesthetics -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-green"
      hx-get="aesthetics/index.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      View Aesthetics
    </button>
    <div class="drawer-output"></div>
  </div>

  <!-- 2. Spiritual Skills -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-cyan"
      hx-get="spiritual-skills.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      Spiritual Skills
    </button>
    <div class="drawer-output"></div>
  </div>

<!-- Inside index.html <section class="os-workspace"> -->
  <!-- 3. UX/DX Priority -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-purple"
      hx-get="uxpriority.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      UX/DX Priority
    </button>
    <div class="drawer-output"></div>
  </div>

  <!-- 5. Design Process (Placed right after UX/DX Priority, not persistent) -->
  <div class="nav-item">
    <button 
      class="vibe-btn btn-doc"
      hx-get="design-process.html"
      hx-target="next .drawer-output"
      hx-swap="innerHTML">
      📁 Design Process
    </button>
    <div class="drawer-output"></div>
  </div>
</section>
<!-- Remove the old <footer class="os-footer-nav"> block -->


  </main>

<!-- 2. Load Three.js Controllers from Root. -->
<script type="module" src="js/aesthetics/controller.js"></script>
<script>
const footerNav = document.querySelector('.os-footer-nav');

function syncFooterVisibility() {
  if (!footerNav) return;
  const anyWorkspaceOpen = Array.from(
    document.querySelectorAll('.os-workspace .drawer-output')
  ).some((drawer) => drawer.innerHTML.trim() !== '');

  footerNav.style.display = anyWorkspaceOpen ? 'none' : '';
}

document.body.addEventListener('htmx:beforeRequest', (evt) => {
  const triggerEl = evt.detail.elt;
  if (!triggerEl) return;

  // 1. Top-level OS navigation buttons (.vibe-btn)
  if (triggerEl.classList.contains('vibe-btn')) {
    const targetDrawer = triggerEl.nextElementSibling;
    const route = triggerEl.getAttribute('hx-get') || triggerEl.getAttribute('data-hx-get');

    document.querySelectorAll('.drawer-output').forEach((drawer) => {
      if (drawer !== targetDrawer) drawer.innerHTML = '';
    });

    if (targetDrawer && targetDrawer.innerHTML.trim() !== '') {
      evt.preventDefault();
      targetDrawer.innerHTML = '';
      sessionStorage.removeItem('vibeos_top_route');
      sessionStorage.removeItem('vibeos_sub_route');
    } else if (route) {
      sessionStorage.setItem('vibeos_top_route', route);
      sessionStorage.removeItem('vibeos_sub_route');
    }
    syncFooterVisibility();
    return;
  }

  // 2. Any nested aesthetic family trigger inside .drawer-output
  if (triggerEl.closest('.drawer-output')) {
    const subRoute = triggerEl.getAttribute('hx-get') || triggerEl.getAttribute('data-hx-get');
    const familyCard = triggerEl.closest('.family-card') || triggerEl;
    const targetFamilyDrawer = familyCard.nextElementSibling?.classList.contains('family-drawer')
      ? familyCard.nextElementSibling
      : null;

    if (targetFamilyDrawer) {
      document.querySelectorAll('.family-drawer').forEach((drawer) => {
        if (drawer !== targetFamilyDrawer) drawer.innerHTML = '';
      });

      if (targetFamilyDrawer.innerHTML.trim() !== '') {
        evt.preventDefault();
        targetFamilyDrawer.innerHTML = '';
        sessionStorage.removeItem('vibeos_sub_route');
        return;
      }
    }

    if (subRoute) {
      sessionStorage.setItem('vibeos_sub_route', subRoute);
    }
  }
});

// Restore open drawers after refresh
let pendingSubRoute = sessionStorage.getItem('vibeos_sub_route');

document.body.addEventListener('htmx:afterSettle', () => {
  syncFooterVisibility();

  // Wait until HTMX has fully settled and bound events on the newly loaded aesthetics/index.html
  if (pendingSubRoute) {
    const subBtn = document.querySelector(
      `.drawer-output [hx-get="${pendingSubRoute}"], .drawer-output [data-hx-get="${pendingSubRoute}"]`
    );
    if (subBtn) {
      pendingSubRoute = null;
      subBtn.click(); // Native .click() triggers both HTMX and any custom JS listeners
    }
  }
});

window.addEventListener('DOMContentLoaded', () => {
  const savedTopRoute = sessionStorage.getItem('vibeos_top_route');
  if (savedTopRoute) {
    const topBtn = document.querySelector(
      `.vibe-btn[hx-get="${savedTopRoute}"], .vibe-btn[data-hx-get="${savedTopRoute}"]`
    );
    if (topBtn) {
      topBtn.click();
    }
  }
});
</script>

</body>
</html>
