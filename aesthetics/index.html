<!-- aesthetics/index.html -->
<div class="aesthetics-container">
  <link rel="stylesheet" href="aesthetics/index.css">

  <header class="aesthetic-section">
    <h1>Select an aesthetic to explore its sub-aesthetics.</h1>
  </header>

  <div class="families-grid">
    <!-- 1. Pre-Computer / Old UI -->
    <div class="family-item">
      <button type="button" class="family-card" data-family="pre-computer"
              hx-get="aesthetics/coming-soon.html"
              hx-target="next .family-drawer"
              hx-swap="innerHTML">
        <h3>💻 Pre-Computer / Old UI</h3>
      </button>
      <div class="family-drawer"></div>
    </div>

    <!-- 2. Frutiger Aero -->
    <div class="family-item">
      <button type="button" class="family-card" data-family="frutiger-aero"

              hx-target="next .family-drawer"
              hx-swap="innerHTML">
        <h3>🌐 Frutiger Aero</h3>
     </button>
      <div class="family-drawer"></div>
    </div>

    <!-- 3. Vaporwave -->

              hx-swap="innerHTML">
        <h3>🔮 Vaporwave</h3>
      </button>
      <div class="family-drawer"></div>
    </div>

    <!-- 4. Kid-Core -->
    <div class="family-item">
      <button type="button" class="family-card" data-family="kid-core"
              hx-get="aesthetics/coming-soon.html"

        <h3>🧸 Kid-Core</h3>
      </button>

    <!-- 7. Anti-Hustle Culture -->

      <button type="button" class="family-card" data-family="anti-hustle"
              hx-get="aesthetics/coming-soon.html"
              hx-target="next .family-drawer"
              hx-swap="innerHTML">
        <h3>🌿 Anti-Hustle Culture</h3>
      </button>
      <div class="family-drawer"></div>
    </div>

    <!-- 8. Uncategorized / Idea Backlog -->
<div class="family-item">
  <button type="button" class="family-card" data-family="staging"
