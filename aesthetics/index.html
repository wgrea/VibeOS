<!-- aesthetics/index.html -->
<div class="aesthetics-container">
  <!-- This file is important to stay here -->
  <link rel="stylesheet" href="aesthetics/styles/index.css"> 

  <header class="aesthetic-section">
    <h1>Select an aesthetic to explore its sub-aesthetics.</h1>
  </header>

  <div class="families-grid">
<!-- 1. UI History (1920s–2020s) -->
<div class="family-item">
  <button type="button" class="family-card" data-family="ui-history"
          hx-get="aesthetics/ui-history/index.html"
          hx-target="next .family-drawer"
          hx-swap="innerHTML">
    <h3>🕰️ UI History (1920s–2020s)</h3>
  </button>
  <div class="family-drawer"></div>
</div>


    <!-- 2. Frutiger Aero -->
    <div class="family-item">

     </button>
